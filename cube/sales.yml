cubes:
  - name: sales

    sql_table: METRICMIND.ANALYTICS.FCT_SALES

    description: "Governed sales metrics for MetricMind"

    measures:
      - name: revenue
        sql: sales
        type: sum
        description: "Total sales revenue"

      - name: profit
        sql: profit
        type: sum
        description: "Total profit"

      - name: shipping_cost
        sql: shipping_cost
        type: sum
        description: "Total shipping cost"

      - name: profit_margin
        sql: "100.0 * ${profit} / NULLIF(${revenue}, 0)"
        type: number
        description: "Profit margin percentage"

      - name: quantity
        sql: quantity
        type: sum
        description: "Total quantity of products sold"

      - name: discount
        sql: discount
        type: sum
        description: "Total discount amount"
      
      - name: order_count
        sql: order_id
        type: count_distinct
        description: "Number of distinct orders"

      - name: average_order_value
        sql: "1.0 * ${revenue} / NULLIF(${order_count}, 0)"
        type: number
        description: "Average revenue per distinct order"

    dimensions:
      - name: order_date
        sql: order_date
        type: time
        description: "Order date"

      - name: country
        sql: country
        type: string
        description: "Customer country"

      - name: region
        sql: region
        type: string
        description: "Sales region"

      - name: state
        sql: state
        type: string
        description: "Sales state"

      - name: city
        sql: city
        type: string
        description: "Sales city"

      - name: category
        sql: category
        type: string
        description: "Product category"

      - name: market
        sql: market
        type: string
        description: "Sales market"

      - name: sub_category
        sql: sub_category
        type: string
        description: "Product sub-category"

      - name: product_id
        sql: product_id
        type: string
        description: "Product identifier"

      - name: product_name
        sql: product_name
        type: string
        description: "Product name"

      - name: segment
        sql: segment
        type: string
        description: "Customer segment"
