version: 2

models:
  - name: sales_transformed
    description: "Cleaned and transformed sales data"
    columns:
      - name: order_id
        description: "Unique identifier for each order"
        data_tests:
          - not_null
          - unique

      - name: order_date
        description: "Date when the order was placed"
        data_tests:
          - not_null

      - name: country
        description: "Country where the order was placed"
        data_tests:
          - not_null

      - name: state
        description: "State where the order was placed"
        data_tests:
          - not_null

      - name: city
        description: "City where the order was placed"
        data_tests:
          - not_null

      - name: product
        description: "Product associated with the order"
        data_tests:
          - not_null

      - name: revenue
        description: "Revenue generated from the order"
        data_tests:
          - not_null

      - name: cost
        description: "Cost of the order"
        data_tests:
          - not_null

      - name: margin
        description: "Profit margin calculated as revenue minus cost"
        data_tests:
          - not_null

  - name: metrics
    description: "Business metrics calculated from sales data"
    columns:
      - name: total_revenue
        description: "Total revenue generated from sales"
        data_tests:
          - not_null

      - name: total_cost
        description: "Total cost of sales"
        data_tests:
          - not_null

      - name: total_margin
        description: "Total profit margin"
        data_tests:
          - not_null

  - name: product_analytics
    description: "Product-level sales performance analytics"
    columns:
      - name: product
        description: "Product name"
        data_tests:
          - not_null

      - name: total_orders
        description: "Number of distinct orders for the product"
        data_tests:
          - not_null

      - name: total_revenue
        description: "Total revenue generated by the product"
        data_tests:
          - not_null

      - name: total_cost
        description: "Total cost associated with the product"
        data_tests:
          - not_null

      - name: total_margin
        description: "Total margin generated by the product"
        data_tests:
          - not_null

      - name: average_revenue
        description: "Average revenue per order for the product"
        data_tests:
          - not_null

      - name: average_cost
        description: "Average cost per order for the product"
        data_tests:
          - not_null

      - name: average_margin
        description: "Average margin per order for the product"
        data_tests:
          - not_null

  - name: customer_analytics
    description: "Customer-level sales analytics"
    columns:
      - name: country
        description: "Country of the sales"
        data_tests:
          - not_null

      - name: state
        description: "State of the sales"
        data_tests:
          - not_null

      - name: city
        description: "City of the sales"
        data_tests:
          - not_null

      - name: total_orders
        description: "Total number of distinct orders"
        data_tests:
          - not_null

      - name: total_revenue
        description: "Total revenue"
        data_tests:
          - not_null

      - name: total_cost
        description: "Total cost"
        data_tests:
          - not_null

      - name: total_profit
        description: "Total profit"
        data_tests:
          - not_null

      - name: average_order_revenue
        description: "Average revenue per order"
        data_tests:
          - not_null

  - name: analytics_sales
    description: "Sales analytics model for business reporting"
    columns:
      - name: country
        description: "Country of the sale"
        data_tests:
          - not_null

      - name: state
        description: "State of the sale"
        data_tests:
          - not_null

      - name: city
        description: "City of the sale"
        data_tests:
          - not_null

      - name: product
        description: "Product sold"
        data_tests:
          - not_null

      - name: total_orders
        description: "Total number of orders"
        data_tests:
          - not_null

      - name: total_revenue
        description: "Total revenue"
        data_tests:
          - not_null

      - name: total_cost
        description: "Total cost"
        data_tests:
          - not_null

      - name: total_margin
        description: "Total margin"
        data_tests:
          - not_null

      - name: average_revenue
        description: "Average revenue"
        data_tests:
          - not_null